openapi: 3.0.2
info:
  title: Student Information System
  version: 1.0.0
  description: this is generated by fleximeta
  contact:
    email: nicolas.hili@univ-grenoble-alpes.fr
    name: Nicolas Hili
servers:
  - url: https://ppp.alwaysdata.net/
tags:
  - name: Master
    description: The master and the links to navigate the API
  - name: Student
    description: Students of the master
  - name: Prof
    description: Professors of the master
  - name: Module
    description: Modules of the master
components:
  schemas:
    Link:
      type: object
      properties:
        href:
          type: string
      required:
        - href
    Error:
      type: object
      properties:
        error:
          type: string
          example: student not found
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
          description: Number of elements in the whole collection.
    PageLinks:
      type: object
      description: >-
        Links to the current page, and to the next and previous pages when
        they exist.
      properties:
        self:
          type: string
          example: /students?page=2&limit=20
        next:
          type: string
        previous:
          type: string
      required:
        - self
    Page:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        links:
          $ref: '#/components/schemas/PageLinks'
    Master:
      type: object
      properties:
        name:
          type: string
        _links:
          type: object
          properties:
            students:
              $ref: '#/components/schemas/Link'
            profs:
              $ref: '#/components/schemas/Link'
            modules:
              $ref: '#/components/schemas/Link'
            head:
              type: array
              description: The professors responsible for the master.
              items:
                type: object
                properties:
                  name:
                    type: string
                    example: Sonni M.
                  href:
                    type: string
                    example: /profs/697453889
    Person:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: array
          items:
            type: string
        birthDate:
          type: string
          format: date
          nullable: true
    Student:
      allOf:
        - $ref: '#/components/schemas/Person'
        - type: object
          properties:
            ine:
              type: string
    StudentCreation:
      allOf:
        - $ref: '#/components/schemas/Student'
        - required:
            - ine
            - firstName
            - lastName
    StudentReplacement:
      allOf:
        - $ref: '#/components/schemas/Student'
        - required:
            - firstName
            - lastName
    StudentDetails:
      allOf:
        - $ref: '#/components/schemas/Student'
        - type: object
          properties:
            _links:
              type: object
              properties:
                followed_modules:
                  $ref: '#/components/schemas/Link'
    StudentShort:
      type: object
      properties:
        name:
          type: string
          description: Last name followed by the initial of the first name.
          example: Lauryn L.
        ine:
          type: string
        _links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/Link'
    StudentReference:
      type: object
      properties:
        ine:
          type: string
        href:
          type: string
          example: /students/555094194B/
    StudentPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/StudentShort'
    StudentReferencePage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/StudentReference'
    Prof:
      allOf:
        - $ref: '#/components/schemas/Person'
        - type: object
          properties:
            number:
              type: string
    ProfDetails:
      allOf:
        - $ref: '#/components/schemas/Prof'
        - type: object
          properties:
            _links:
              type: object
              properties:
                taught_modules:
                  $ref: '#/components/schemas/Link'
    ProfShort:
      type: object
      properties:
        name:
          type: string
          description: Last name followed by the initial of the first name.
          example: Sonni M.
        number:
          type: string
        _links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/Link'
    ProfReference:
      type: object
      properties:
        name:
          type: string
          description: The number of the professor.
          example: '697453889'
        href:
          type: string
          example: /profs/697453889/
    ProfPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ProfShort'
    ProfReferencePage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ProfReference'
    Evaluation:
      type: object
      properties:
        type:
          type: string
          example: exam
        coefficient:
          type: integer
    Module:
      type: object
      properties:
        name:
          type: string
          description: The code of the module.
          example: OOP
        label:
          type: string
        description:
          type: string
        coefficient:
          type: integer
        evaluations:
          type: array
          items:
            $ref: '#/components/schemas/Evaluation'
    ModuleDetails:
      allOf:
        - $ref: '#/components/schemas/Module'
        - type: object
          properties:
            _links:
              type: object
              properties:
                enrolled_students:
                  $ref: '#/components/schemas/Link'
                teachers:
                  $ref: '#/components/schemas/Link'
    ModuleShort:
      type: object
      properties:
        name:
          type: string
          description: The code of the module.
          example: OOP
        _links:
          type: object
          properties:
            self:
              $ref: '#/components/schemas/Link'
    ModuleReference:
      type: object
      properties:
        name:
          type: string
          description: The code of the module.
          example: WEB01
        href:
          type: string
          example: /modules/web01/
    ModulePage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ModuleShort'
    ModuleReferencePage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ModuleReference'
  parameters:
    pageParam:
      name: page
      in: query
      description: The page to return.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    limitParam:
      name: limit
      in: query
      description: Max number of elements to return.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Student_ine:
      name: ine
      in: path
      required: true
      description: >-
        The ine parameter of the Student node. This property is a unique
        ID.
      schema:
        type: string
    Prof_number:
      name: number
      in: path
      required: true
      description: >-
        The number parameter of the Prof node. This property is a unique
        ID.
      schema:
        type: string
    Module_code:
      name: code
      in: path
      required: true
      description: >-
        The code of the Module node, in lower case (oop for the module OOP).
        This property is a unique ID.
      schema:
        type: string
        example: oop
  responses:
    InvalidPagination:
      description: The page or limit parameter is not a valid integer, or is out of range.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidBody:
      description: >-
        The body is not a JSON object, contains an unknown field, misses a
        required field, or has a field of the wrong type.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StudentNotFound:
      description: >-
        A 404 error is returned whenever the client incorrectly enters one of
        the following properties: ine
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProfNotFound:
      description: >-
        A 404 error is returned whenever the client incorrectly enters one of
        the following properties: number
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ModuleNotFound:
      description: >-
        A 404 error is returned whenever the client incorrectly enters one of
        the following properties: code
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
paths:
  /:
    get:
      summary: Get all information of one Master node
      tags:
        - Master
      responses:
        '200':
          description: A single Master is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Master'
      parameters: []
  /students/:
    get:
      summary: List all Student nodes
      tags:
        - Student
      responses:
        '200':
          description: One page of short representations of students
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentPage'
        '400':
          $ref: '#/components/responses/InvalidPagination'
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
    post:
      summary: Create a new Student node
      tags:
        - Student
      responses:
        '201':
          description: The Student node has been correctly created.
          headers:
            Location:
              description: The URL of the new Student node.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDetails'
        '400':
          $ref: '#/components/responses/InvalidBody'
        '409':
          description: Student with given ine already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreation'
      parameters: []
  /students/{ine}/:
    get:
      summary: Get all information of one Student node
      tags:
        - Student
      responses:
        '200':
          description: A single Student is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDetails'
        '404':
          $ref: '#/components/responses/StudentNotFound'
      parameters:
        - $ref: '#/components/parameters/Student_ine'
    put:
      summary: Replace all information of one Student node
      description: >-
        Every attribute is replaced. An optional attribute that is left out
        (email, birthDate) is emptied. The ine cannot be changed.
      tags:
        - Student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentReplacement'
      responses:
        '204':
          description: The Student node has been replaced.
        '400':
          $ref: '#/components/responses/InvalidBody'
        '404':
          $ref: '#/components/responses/StudentNotFound'
      parameters:
        - $ref: '#/components/parameters/Student_ine'
    patch:
      summary: Modify some information of one Student node
      description: Only the attributes present in the body are changed. The ine cannot be changed.
      tags:
        - Student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Student'
      responses:
        '204':
          description: The Student node has been modified.
        '400':
          $ref: '#/components/responses/InvalidBody'
        '404':
          $ref: '#/components/responses/StudentNotFound'
      parameters:
        - $ref: '#/components/parameters/Student_ine'
    delete:
      summary: Delete one Student node
      description: The student is also removed from the modules it followed.
      tags:
        - Student
      responses:
        '204':
          description: The Student node has been deleted.
        '404':
          $ref: '#/components/responses/StudentNotFound'
      parameters:
        - $ref: '#/components/parameters/Student_ine'
  /students/{ine}/followed_modules/:
    get:
      summary: List the Module nodes followed by one Student node
      tags:
        - Student
        - Module
      responses:
        '200':
          description: One page of the modules followed by the student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleReferencePage'
        '400':
          $ref: '#/components/responses/InvalidPagination'
        '404':
          $ref: '#/components/responses/StudentNotFound'
      parameters:
        - $ref: '#/components/parameters/Student_ine'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
  /profs/:
    get:
      summary: List all Prof nodes
      tags:
        - Prof
      responses:
        '200':
          description: One page of short representations of professors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfPage'
        '400':
          $ref: '#/components/responses/InvalidPagination'
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
  /profs/{number}/:
    get:
      summary: Get all information of one Prof node
      tags:
        - Prof
      responses:
        '200':
          description: A single Prof is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfDetails'
        '404':
          $ref: '#/components/responses/ProfNotFound'
      parameters:
        - $ref: '#/components/parameters/Prof_number'
  /profs/{number}/taught_modules/:
    get:
      summary: List the Module nodes taught by one Prof node
      tags:
        - Prof
        - Module
      responses:
        '200':
          description: One page of the modules taught by the professor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleReferencePage'
        '400':
          $ref: '#/components/responses/InvalidPagination'
        '404':
          $ref: '#/components/responses/ProfNotFound'
      parameters:
        - $ref: '#/components/parameters/Prof_number'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
  /modules/:
    get:
      summary: List all Module nodes
      tags:
        - Module
      responses:
        '200':
          description: One page of short representations of modules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModulePage'
        '400':
          $ref: '#/components/responses/InvalidPagination'
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
  /modules/{code}/:
    get:
      summary: Get all information of one Module node
      tags:
        - Module
      responses:
        '200':
          description: A single Module is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleDetails'
        '404':
          $ref: '#/components/responses/ModuleNotFound'
      parameters:
        - $ref: '#/components/parameters/Module_code'
  /modules/{code}/enrolled_students/:
    get:
      summary: List the Student nodes registered in one Module node
      tags:
        - Module
        - Student
      responses:
        '200':
          description: One page of the students registered in the module
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentReferencePage'
        '400':
          $ref: '#/components/responses/InvalidPagination'
        '404':
          $ref: '#/components/responses/ModuleNotFound'
      parameters:
        - $ref: '#/components/parameters/Module_code'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
  /modules/{code}/teachers/:
    get:
      summary: List the Prof nodes who teach one Module node
      tags:
        - Module
        - Prof
      responses:
        '200':
          description: One page of the professors who teach the module
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfReferencePage'
        '400':
          $ref: '#/components/responses/InvalidPagination'
        '404':
          $ref: '#/components/responses/ModuleNotFound'
      parameters:
        - $ref: '#/components/parameters/Module_code'
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
